services:
  gridshift:
    build: .
    depends_on:
      - gridshift-api
    restart: unless-stopped

  gridshift-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      PORT: "3001"

      GRIDSHIFT_SESSION_SECRET: ${GRIDSHIFT_SESSION_SECRET:?GRIDSHIFT_SESSION_SECRET is required}
      GRIDSHIFT_BDL_API_KEY: ${GRIDSHIFT_BDL_API_KEY:-}
      GRIDSHIFT_BDL_TIER: ${GRIDSHIFT_BDL_TIER:-goat}

      GRIDSHIFT_LIVE_ALLOWED_LEAGUE_IDS: ${GRIDSHIFT_LIVE_ALLOWED_LEAGUE_IDS:-}
      GRIDSHIFT_LIVE_ACCESS_CODE: ${GRIDSHIFT_LIVE_ACCESS_CODE:-}
      GRIDSHIFT_LIVE_COOKIE_SECRET: ${GRIDSHIFT_LIVE_COOKIE_SECRET:?GRIDSHIFT_LIVE_COOKIE_SECRET is required}

      GRIDSHIFT_LIVE_CACHE_TTL_MS: ${GRIDSHIFT_LIVE_CACHE_TTL_MS:-1000}
      GRIDSHIFT_LIVE_FINAL_TTL_MS: ${GRIDSHIFT_LIVE_FINAL_TTL_MS:-14400000}
      GRIDSHIFT_LIVE_ARCHIVE_ENABLED: ${GRIDSHIFT_LIVE_ARCHIVE_ENABLED:-true}
      GRIDSHIFT_LIVE_MAX_REQ_PER_MIN: ${GRIDSHIFT_LIVE_MAX_REQ_PER_MIN:-300}
      GRIDSHIFT_COOKIE_SECURE: ${GRIDSHIFT_COOKIE_SECURE:-true}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - gridshift
    restart: unless-stopped
